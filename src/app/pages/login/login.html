<section>
    <form class="login-form" #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="editto-layout-login">
            <img class="layout-img" src="login-layout.webp">
        </div>
        <div class="login-form-inputs">
            <h1>Login</h1>
            <mat-form-field>
                <mat-label>Digite o nome de usuario</mat-label>
                <input name="usuario" [(ngModel)]="loginData.usuario" matInput type="text">
            </mat-form-field>

            <mat-form-field>
                <mat-label>Digite a sua senha</mat-label>
                <input name="senha" [(ngModel)]="loginData.senha" matInput [type]="hide() ? 'password' : 'text'" />
                <button matIconButton matSuffix (click)="clickEvent($event)" [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hide()">
                    <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            
                <button matButton="tonal" type="submit">Login</button>
            </div>
    </form>
</section>
