<h2 matDialogTitle>{{ isEditMode ? 'Editar Projeto' : 'Adicionar Novo Projeto' }}</h2>

<mat-dialog-content>
    <form class="add-projeto" #form="ngForm" (ngSubmit)="salvarProjeto(form)">

        <mat-form-field appearance="outline" class="input-field">
            <mat-label>Titulo do projeto</mat-label>
            <input required matInput type="text" name="titulo" [(ngModel)]="projetoData.titulo">
        </mat-form-field>

        <mat-form-field appearance="outline" class="input-field">
            <mat-label>Categoria</mat-label>
            <input required matInput type="text" name="categoria" [(ngModel)]="projetoData.categoria">
        </mat-form-field>

        <mat-form-field appearance="outline" class="input-field">
            <mat-label>Link do Projeto</mat-label>
            <input matInput type="text" name="url" [(ngModel)]="projetoData.urlLink">
        </mat-form-field>

        <mat-form-field appearance="outline" class="input-field">
            <mat-label>Imagem (url)</mat-label>
            <input required matInput type="text" name="img" [(ngModel)]="projetoData.urlImg">
        </mat-form-field>

        <div class="checkbox-container">
            <mat-checkbox name="exibir" [checked]="" [(ngModel)]="projetoData.exibir">
                Exibir Projeto
            </mat-checkbox>
        </div>

        <div class="checkbox-container">
            <mat-checkbox name="destaque" [checked]="" [(ngModel)]="projetoData.destaque">
                Destacar Projeto
            </mat-checkbox>
        </div>
        <div class="form-actions">
        <button type="submit" matButton="filled" [disabled]="form.invalid">
            {{ isEditMode ? 'Salvar Alterações' : 'Adicionar' }}
        </button>
        <button mat-button mat-dialog-close>Cancelar</button>
        </div>

    </form>
</mat-dialog-content>
