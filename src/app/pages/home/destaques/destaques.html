<mat-card class="destaques-card">
    <mat-card-header><h2>Destaques</h2></mat-card-header>
    <div class="destaque-cards-imgs">
        @for(image of visibleImages(); track image.id){
            <a target="_blank" [href]="image.urlLink">
                <img class="img-carrosel" [src]="image.urlImg" [alt]="image.titulo" [@fadeAnimation]>
            </a>
        }
    </div>
</mat-card>
