<mat-card [ngClass]="{'card-projeto-dashboard' : isDashboard(), 'card-projeto-home' : !isDashboard()}" appearance="outlined">
  <mat-card-header [ngClass]="{'quebraDeTexto' : isDashboard()}">
    <mat-card-title>
      <ng-content select="[titulo]" />
    </mat-card-title>
    <mat-card-subtitle>
      <ng-content select="[tipo]" />
    </mat-card-subtitle>
  </mat-card-header>

  <div class="img-container">
    <ng-content select="[url]" />
  </div>

  @if (isDashboard()) {
    <mat-card-actions>
      <ng-content select="[buttons]" />
    </mat-card-actions>
  }
</mat-card>
